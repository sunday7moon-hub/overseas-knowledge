<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>出海数据简报·蓝版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { display:flex; justify-content:center; padding:0;
         font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei","Noto Sans SC",sans-serif; }
  .poster { width:1080px; height:1440px; position:relative; overflow:hidden; display:flex; flex-direction:column; }

  body { background:#1a1a2e; }
  .poster { background:linear-gradient(158deg,#0B1046 0%,#1a237e 46%,#283593 100%); }
  .grid-bg { position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,0.09) 2px, transparent 2px);
             background-size:46px 46px; }
  .header { padding:44px 60px 0; display:flex; justify-content:space-between; align-items:center; position:relative; z-index:2; }
  .brand-name { font-size:34px; font-weight:800; color:#fff; }
  .badge { background:rgba(255,255,255,0.16); color:#FFD700; font-size:26px; font-weight:700; padding:12px 30px; border-radius:40px; }
  .main { flex:1; display:flex; flex-direction:column; padding:48px 60px 0; position:relative; z-index:2; }
  .nums { display:flex; gap:26px; align-items:stretch; height:330px; }
  .num-main { flex:1.4; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.18); border-radius:34px;
              padding:40px 32px 34px; display:flex; flex-direction:column; justify-content:center; }
  .big-num { font-size:172px; font-weight:900; color:#FFD700; line-height:0.9; letter-spacing:-8px; }
  .big-unit { font-size:36px; font-weight:800; color:#fff; margin-top:16px; }
  .big-label { font-size:29px; color:rgba(255,255,255,0.72); margin-top:8px; }
  .side { flex:1; display:flex; flex-direction:column; gap:26px; }
  .side-item { flex:1; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.18); border-radius:28px;
               padding:26px 24px; display:flex; flex-direction:column; justify-content:center; }
  .side-num { font-size:74px; font-weight:900; color:#7FE3C0; line-height:1; letter-spacing:-2px; }
  .side-label { font-size:27px; color:rgba(255,255,255,0.8); margin-top:12px; line-height:1.3; }
  .title { margin-top:50px; font-size:66px; font-weight:800; color:#fff; line-height:1.24; letter-spacing:1px; }
  .bar { width:120px; height:8px; background:#FFD700; border-radius:4px; margin:30px 0 38px; }
  .pts { display:flex; flex-direction:column; gap:24px; }
  .pt { display:flex; gap:20px; align-items:flex-start; }
  .pt-line { flex-shrink:0; width:8px; height:50px; background:#7FE3C0; border-radius:4px; }
  .pt-txt { font-size:33px; font-weight:600; color:rgba(255,255,255,0.94); line-height:1.44; }
  .note { margin-top:auto; margin-bottom:30px; font-size:30px; font-weight:700; color:#FFD700;
          background:rgba(255,215,0,0.12); border-left:8px solid #FFD700; padding:24px 28px; border-radius:0 18px 18px 0; }
  .footer { flex-shrink:0; background:rgba(0,0,0,0.25); padding:26px 60px 32px; display:flex; align-items:center; position:relative; z-index:2; }
  .footer-name { font-size:30px; font-weight:800; color:#fff; }
  .footer-desc { font-size:22px; color:rgba(255,255,255,0.55); margin-top:6px; }
</style>
</head>
<body>
<div class="poster">
  <div class="grid-bg"></div>
  <div class="header">
    <div class="brand-name">📌 出海速览</div>
    <div class="badge">{{BADGE}}</div>
  </div>
  <div class="main">
    <div class="nums">
      <div class="num-main">
        <div class="big-num">{{BIGNUM}}</div>
        <div class="big-unit">{{BIGUNIT}}</div>
        <div class="big-label">{{BIGLABEL}}</div>
      </div>
      <div class="side">
        <div class="side-item">
          <div class="side-num">{{S1NUM}}</div>
          <div class="side-label">{{S1LABEL}}</div>
        </div>
        <div class="side-item">
          <div class="side-num">{{S2NUM}}</div>
          <div class="side-label">{{S2LABEL}}</div>
        </div>
      </div>
    </div>
    <div class="title">{{TITLE}}</div>
    <div class="bar"></div>
    <div class="pts">
{{POINTS}}
    </div>
    <div class="note">{{NOTE}}</div>
  </div>
  <div class="footer">
    <div>
      <div class="footer-name">📌 下一期见 👋</div>
      <div class="footer-desc">数据来源：各国官方公告及权威媒体</div>
    </div>
  </div>
</div>
</body>
</html>
