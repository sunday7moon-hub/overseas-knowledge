<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>出海风险预警·紫版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { display:flex; justify-content:center; padding:0;
         font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei","Noto Sans SC",sans-serif; }
  .poster { width:1080px; height:1440px; position:relative; overflow:hidden; display:flex; flex-direction:column; }

  body { background:#fff; }
  .poster { background:linear-gradient(158deg,#FFD6F0 0%,#C9A8E8 52%,#9F7AD4 100%); }
  .glow { position:absolute; border-radius:50%; pointer-events:none;
          background:radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 70%); }
  .g1 { width:460px; height:460px; top:-150px; left:-140px; }
  .g2 { width:400px; height:400px; bottom:180px; right:-130px; }
  .warn { background:linear-gradient(90deg,#FF512F 0%,#FF8A00 100%); padding:28px 60px;
          display:flex; align-items:center; gap:20px; position:relative; z-index:2; }
  .warn-ico { font-size:48px; line-height:1; }
  .warn-txt { font-size:40px; font-weight:900; color:#fff; letter-spacing:3px; }
  .header { padding:38px 60px 0; display:flex; justify-content:space-between; align-items:center; position:relative; z-index:2; }
  .brand-name { font-size:34px; font-weight:800; color:#2D1A4D; }
  .badge { background:#fff; color:#2D1A4D; font-size:26px; font-weight:700; padding:12px 30px; border-radius:40px;
           box-shadow:0 4px 16px rgba(74,45,122,0.18); }
  .main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 60px; position:relative; z-index:2; }
  .title { font-size:116px; font-weight:900; color:#2D1A4D; line-height:1.14; letter-spacing:3px;
           text-shadow:5px 5px 0 rgba(255,255,255,0.55); }
  .focus { margin-top:54px; text-align:center; background:rgba(255,255,255,0.46); border:4px solid rgba(255,255,255,0.72);
           border-radius:40px; padding:42px 30px 38px; box-shadow:0 10px 34px rgba(74,45,122,0.16); }
  .focus-num { font-size:200px; font-weight:900; color:#FF8A00; line-height:0.9; letter-spacing:-10px;
               text-shadow:4px 4px 0 #FFB300; }
  .focus-unit { font-size:42px; font-weight:800; color:#2D1A4D; margin-top:12px; letter-spacing:1px; }
  .focus-label { font-size:31px; font-weight:700; color:#4A2D7A; margin-top:12px; }
  .chain { margin-top:50px; display:flex; align-items:center; gap:12px; }
  .chain-step { flex:1; background:#fff; border-radius:22px; padding:26px 12px; text-align:center;
                font-size:29px; font-weight:800; color:#2D1A4D; box-shadow:0 5px 16px rgba(74,45,122,0.14); }
  .chain-arrow { font-size:42px; font-weight:900; color:#FF8A00; flex-shrink:0; }
  .footer { flex-shrink:0; background:rgba(255,255,255,0.55); padding:26px 60px 32px; display:flex; align-items:center; position:relative; z-index:2; }
  .footer-name { font-size:30px; font-weight:800; color:#2D1A4D; }
  .footer-desc { font-size:22px; color:#4A2D7A; margin-top:6px; }
</style>
</head>
<body>
<div class="poster">
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="warn">
    <div class="warn-ico">⚠️</div>
    <div class="warn-txt">{{WARN}}</div>
  </div>
  <div class="header">
    <div class="brand-name">📌 出海速览</div>
    <div class="badge">{{BADGE}}</div>
  </div>
  <div class="main">
    <div class="title">{{TITLE}}</div>
    <div class="focus">
      <div class="focus-num">{{FNUM}}</div>
      <div class="focus-unit">{{FUNIT}}</div>
      <div class="focus-label">{{FLABEL}}</div>
    </div>
    <div class="chain">
      <div class="chain-step">{{C1}}</div>
      <div class="chain-arrow">→</div>
      <div class="chain-step">{{C2}}</div>
      <div class="chain-arrow">→</div>
      <div class="chain-step">{{C3}}</div>
    </div>
  </div>
  <div class="footer">
    <div>
      <div class="footer-name">📌 下一期见 👋</div>
      <div class="footer-desc">数据来源：各国官方公告及权威媒体</div>
    </div>
  </div>
</div>
</body>
</html>
