<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1440">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1440px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .card {
    width: 900px;
    padding: 80px 60px;
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.15);
  }
  .tag {
    display: inline-block;
    padding: 8px 24px;
    background: #667eea;
    color: white;
    border-radius: 20px;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 40px;
  }
  .headline {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.3;
    color: #1a1a2e;
    margin-bottom: 30px;
  }
  .subtitle {
    font-size: 32px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 50px;
  }
  .stat {
    font-size: 28px;
    color: #667eea;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">{{TAG}}</div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="subtitle">{{SUBTITLE}}</div>
    <div class="stat">{{STAT}}</div>
  </div>
</body>
</html>
